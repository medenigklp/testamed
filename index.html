<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>testamed — Soru & Test Oluşturucu</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- KaTeX (Kimyasal/Matematiksel Formül Desteği) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
  <!-- FontAwesome İkonlar -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    @media print {
      .no-print { display: none !important; }
      .print-only { display: block !important; }
      body { background: white; color: black; }
      .test-container { columns: 2; column-gap: 30px; }
      .question-item { break-inside: avoid; page-break-inside: avoid; margin-bottom: 24px; }
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans">

  <!-- Üst Menü / Navbar -->
  <header class="no-print border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-500 to-teal-400 flex items-center justify-center font-bold text-slate-950 text-xl shadow-lg shadow-emerald-500/20 lowercase">
          t
        </div>
        <div>
          <span class="text-xl font-extrabold tracking-tight bg-gradient-to-r from-emerald-400 to-teal-200 bg-clip-text text-transparent lowercase">testamed</span>
          <span class="text-xs ml-2 px-2 py-0.5 rounded-full bg-slate-800 text-slate-400 border border-slate-700">stüdyo panel</span>
        </div>
      </div>
      
      <div class="flex items-center gap-2">
        <button onclick="window.print()" class="px-4 py-2 text-sm font-medium bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg border border-slate-700 transition flex items-center gap-2">
          <i class="fa-solid fa-print"></i> Baskı / PDF Al
        </button>
        <button onclick="exportJSON()" class="px-4 py-2 text-sm font-medium bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg shadow-md shadow-emerald-600/20 transition flex items-center gap-2">
          <i class="fa-solid fa-download"></i> JSON İndir
        </button>
      </div>
    </div>
  </header>

  <!-- Ana Çalışma Alanı -->
  <main class="max-w-7xl mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
    
    <!-- Sol Panel: Soru Oluşturma Formu -->
    <section class="no-print lg:col-span-5 bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl h-fit">
      <h2 class="text-lg font-bold text-slate-200 mb-4 flex items-center gap-2">
        <i class="fa-solid fa-pen-nib text-emerald-400"></i> Yeni Soru Ekle
      </h2>

      <form id="questionForm" class="space-y-4">
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">Sınıf / Düzey</label>
            <select id="grade" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm focus:border-emerald-500 focus:outline-none text-slate-200">
              <option value="9. Sınıf">9. Sınıf</option>
              <option value="10. Sınıf">10. Sınıf</option>
              <option value="11. Sınıf">11. Sınıf</option>
              <option value="12. Sınıf">12. Sınıf / YKS</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">Konu Başlığı</label>
            <input type="text" id="topic" placeholder="Örn: Kimyasal Türler" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm focus:border-emerald-500 focus:outline-none text-slate-200" required>
          </div>
        </div>

        <div>
          <div class="flex justify-between items-center mb-1">
            <label class="block text-xs font-semibold text-slate-400">Soru Metni & Öncüller</label>
            <span class="text-[10px] text-slate-500 font-mono">Formül için: $H_2O$ veya $Na^+$</span>
          </div>
          <textarea id="questionText" rows="4" placeholder="Soru kökünü yazın..." class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-sm focus:border-emerald-500 focus:outline-none text-slate-200 resize-y" required></textarea>
        </div>

        <!-- Şıklar -->
        <div class="space-y-2">
          <label class="block text-xs font-semibold text-slate-400">Seçenekler ve Doğru Cevap</label>
          
          <div class="space-y-2">
            <div class="flex items-center gap-2">
              <input type="radio" name="correctOpt" value="A" checked class="accent-emerald-500 w-4 h-4 cursor-pointer">
              <span class="text-xs font-bold text-slate-400 w-4">A)</span>
              <input type="text" id="optA" placeholder="A seçeneği" class="w-full bg-slate-950 border border-slate-800 rounded-md px-3 py-1.5 text-sm focus:border-emerald-500 focus:outline-none" required>
            </div>
            <div class="flex items-center gap-2">
              <input type="radio" name="correctOpt" value="B" class="accent-emerald-500 w-4 h-4 cursor-pointer">
              <span class="text-xs font-bold text-slate-400 w-4">B)</span>
              <input type="text" id="optB" placeholder="B seçeneği" class="w-full bg-slate-950 border border-slate-800 rounded-md px-3 py-1.5 text-sm focus:border-emerald-500 focus:outline-none" required>
            </div>
            <div class="flex items-center gap-2">
              <input type="radio" name="correctOpt" value="C" class="accent-emerald-500 w-4 h-4 cursor-pointer">
              <span class="text-xs font-bold text-slate-400 w-4">C)</span>
              <input type="text" id="optC" placeholder="C seçeneği" class="w-full bg-slate-950 border border-slate-800 rounded-md px-3 py-1.5 text-sm focus:border-emerald-500 focus:outline-none" required>
            </div>
            <div class="flex items-center gap-2">
              <input type="radio" name="correctOpt" value="D" class="accent-emerald-500 w-4 h-4 cursor-pointer">
              <span class="text-xs font-bold text-slate-400 w-4">D)</span>
              <input type="text" id="optD" placeholder="D seçeneği" class="w-full bg-slate-950 border border-slate-800 rounded-md px-3 py-1.5 text-sm focus:border-emerald-500 focus:outline-none" required>
            </div>
            <div class="flex items-center gap-2">
              <input type="radio" name="correctOpt" value="E" class="accent-emerald-500 w-4 h-4 cursor-pointer">
              <span class="text-xs font-bold text-slate-400 w-4">E)</span>
              <input type="text" id="optE" placeholder="E seçeneği" class="w-full bg-slate-950 border border-slate-800 rounded-md px-3 py-1.5 text-sm focus:border-emerald-500 focus:outline-none" required>
            </div>
          </div>
        </div>

        <button type="submit" class="w-full py-2.5 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold rounded-lg transition mt-2 shadow-lg shadow-emerald-500/10">
          + Teste Soru Ekle
        </button>
      </form>
    </section>

    <!-- Sağ Panel: Canlı Test Sayfası & Önizleme -->
    <section class="lg:col-span-7 bg-white text-slate-900 rounded-2xl p-6 md:p-8 shadow-2xl min-h-[600px] border border-slate-200">
      
      <!-- Test Başlığı (Yazdırmada görünür) -->
      <div class="border-b-2 border-slate-900 pb-4 mb-6 flex justify-between items-end">
        <div>
          <h1 class="text-2xl font-black tracking-tight text-slate-950 lowercase">testamed soru bankası</h1>
          <p class="text-xs font-semibold text-slate-600 mt-1" id="testSubHeader">Kazanım Değerlendirme Testi</p>
        </div>
        <div class="text-right text-xs font-bold text-slate-500">
          <span class="lowercase">stüdyamed</span>
        </div>
      </div>

      <!-- Sorular Listesi -->
      <div id="questionsContainer" class="test-container space-y-6">
        <p id="emptyState" class="text-center text-slate-400 py-12 text-sm italic no-print">
          Henüz soru eklenmedi. Sol panelden ilk sorunuzu ekleyin.
        </p>
      </div>
    </section>

  </main>

  <script>
    let questions = [];

    const form = document.getElementById('questionForm');
    const container = document.getElementById('questionsContainer');
    const emptyState = document.getElementById('emptyState');

    form.addEventListener('submit', (e) => {
      e.preventDefault();

      const newQuestion = {
        id: Date.now(),
        grade: document.getElementById('grade').value,
        topic: document.getElementById('topic').value,
        text: document.getElementById('questionText').value,
        options: {
          A: document.getElementById('optA').value,
          B: document.getElementById('optB').value,
          C: document.getElementById('optC').value,
          D: document.getElementById('optD').value,
          E: document.getElementById('optE').value,
        },
        correct: document.querySelector('input[name="correctOpt"]:checked').value
      };

      questions.push(newQuestion);
      form.reset();
      renderQuestions();
    });

    function deleteQuestion(id) {
      questions = questions.filter(q => q.id !== id);
      renderQuestions();
    }

    function renderQuestions() {
      if (questions.length === 0) {
        emptyState.style.display = 'block';
        container.innerHTML = '';
        container.appendChild(emptyState);
        return;
      }

      emptyState.style.display = 'none';
      container.innerHTML = '';

      questions.forEach((q, index) => {
        const qEl = document.createElement('div');
        qEl.className = 'question-item relative bg-slate-50/60 p-4 rounded-xl border border-slate-200/80 mb-4';
        
        qEl.innerHTML = `
          <div class="flex justify-between items-start mb-2">
            <span class="font-bold text-sm bg-slate-900 text-white px-2 py-0.5 rounded">${index + 1}. Soru</span>
            <div class="no-print flex items-center gap-2">
              <span class="text-[11px] font-semibold text-emerald-700 bg-emerald-100 px-2 py-0.5 rounded">Cevap: ${q.correct}</span>
              <button onclick="deleteQuestion(${q.id})" class="text-rose-500 hover:text-rose-700 text-xs px-1.5 py-0.5 rounded">
                <i class="fa-solid fa-trash"></i>
              </button>
            </div>
          </div>
          
          <div class="text-sm font-medium text-slate-800 leading-relaxed mb-3 whitespace-pre-line formula-render">
            ${q.text}
          </div>

          <div class="space-y-1.5 text-xs font-medium text-slate-700">
            <div class="flex gap-2"><b>A)</b> <span class="formula-render">${q.options.A}</span></div>
            <div class="flex gap-2"><b>B)</b> <span class="formula-render">${q.options.B}</span></div>
            <div class="flex gap-2"><b>C)</b> <span class="formula-render">${q.options.C}</span></div>
            <div class="flex gap-2"><b>D)</b> <span class="formula-render">${q.options.D}</span></div>
            <div class="flex gap-2"><b>E)</b> <span class="formula-render">${q.options.E}</span></div>
          </div>
        `;

        container.appendChild(qEl);
      });

      // KaTeX formül tetikleme ($...$ işaretleri arası)
      renderMathInElement(container, {
        delimiters: [
          { left: "$$", right: "$$", display: true },
          { left: "$", right: "$", display: false }
        ],
        throwOnError: false
      });
    }

    function exportJSON() {
      if (questions.length === 0) {
        alert("İndirmek için en az bir soru ekleyin.");
        return;
      }
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(questions, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", "testamed_sorular.json");
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }
  </script>
</body>
</html>
